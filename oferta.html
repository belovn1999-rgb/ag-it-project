  <body class="offerBody">
    <div class="offerApp">
      <header class="offerBar" data-offer-hide>
        <a class="offerBack" href="./mobile.html#monitoring">← Monitoring</a>
        <div class="offerBarTitle">
          <b data-offer-heading>Oferta dla klienta</b>
          <span class="offerStatus" data-offer-status aria-live="polite"></span>
        </div>
        <div class="offerBarActions">

          <button class="offerButton" type="button" data-offer-mail>Wyślij e-mail</button>
        </div>
        <div class="offerMailRow" data-offer-link-row hidden>
          <label>Link dla klienta<input type="url" readonly data-offer-link-field /></label>
          <button class="offerButton isPrimary" type="button" data-offer-link-copy>Kopiuj</button>
        </div>
        <div class="offerMailRow" data-offer-mail-row data-offer-hide hidden>
          <label>E-mail klienta<input type="email" data-offer-mail-to placeholder="klient@example.com" autocomplete="email" /></label>
          <button class="offerButton isPrimary" type="button" data-offer-mail-send>Wyślij</button>
        </div>
      </header>
      <div class="offerWork">
        <main class="offerStage" data-offer-stage>
          <p class="offerWaiting">Przygotowuję ofertę…</p>
        </main>
        <aside class="offerPanel" data-offer-panel data-offer-hide></aside>
      </div>
