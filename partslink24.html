<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUTOGOOD VIN спецификация</title>
    <meta name="description" content="Внутренний инструмент AUTOGOOD: проверка VIN по каталогу производителя, отчёт PDF, дата производства и данные двигателя." />
    <meta name="theme-color" content="#15304a" />
    <link rel="icon" href="./assets/ag-opt.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/autogood-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./tokens.css?v=vincheck-20260724-1" />
    <link rel="stylesheet" href="./src/tools.css?v=vincheck-20260724-1" />
    <link rel="stylesheet" href="./src/global-navigation.css?v=global-navigation-20260923" />
    <script defer src="./src/global-navigation.js?v=nav-offer-1010" data-ag-global-nav></script>
    <style>
      /* Hallmark · macrostructure: Workbench · tone: utilitarian · anchor hue: AUTOGOOD blue · nav: N9 · footer: Ft2 · contrast: pass (40–41) · mobile: pass (34, 49, 50–57) */
      :root {
        color-scheme: light;
        --ag-color-option-selected: oklch(93% 0.025 240);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --ag-color-paper: oklch(20.5% 0.014 248);
          --ag-color-surface: oklch(24.5% 0.016 248);
          --ag-color-surface-tint: oklch(28.5% 0.018 248);
          --ag-color-ink: oklch(95% 0.006 248);
          --ag-color-ink-2: oklch(80% 0.012 248);
          --ag-color-muted: oklch(66% 0.016 248);
          --ag-color-soft: oklch(52% 0.018 248);
          --ag-color-rule: oklch(33% 0.018 248);
          --ag-color-rule-2: oklch(41% 0.022 248);
          /* The brand blue sits at 41.5% lightness, which disappears against a
             dark surface, so accent and its emphasis step swap direction. */
          --ag-color-accent: oklch(72% 0.105 240);
          --ag-color-accent-dark: oklch(83% 0.085 240);
          --ag-color-accent-ink: oklch(19% 0.02 248);
          --ag-color-success: oklch(75% 0.13 164);
          --ag-color-error: oklch(72% 0.14 25);
          --ag-color-focus: oklch(80% 0.1 240);
          --ag-color-option-selected: oklch(36% 0.05 240);
        }
      }

      html,
      body {
        overflow-x: clip;
      }

      body.partslinkPage {
        min-width: 320px;
        background: var(--ag-color-paper);
        color: var(--ag-color-ink);
        font-family: var(--ag-font-body);
        font-variant-numeric: tabular-nums;
      }

      .partslinkPage :focus {
        outline: none;
      }

      .partslinkPage :focus-visible {
        outline: 2px solid var(--ag-color-focus);
        outline-offset: 2px;
      }

      .partslinkShell {
        display: flex;
        flex-direction: column;
        width: min(1200px, calc(100% - 40px));
        min-height: 100vh;
        margin: 0 auto;
        padding: var(--ag-space-2xl) 0 var(--ag-space-page-bottom);
      }

      .partslinkTopbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--ag-space-lg);
        padding-bottom: var(--ag-space-md);
        border-bottom: var(--ag-rule-card);
      }

      .partslinkWordmark {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
        color: var(--ag-color-ink);
        text-decoration: none;
      }

      .partslinkWordmark img {
        width: 164px;
        max-width: var(--ag-logo-max-width);
        height: auto;
        display: block;
        /* The logo PNG carries an opaque white plate (RGBA, alpha 255 white
           throughout), which reads as a box on the grey page and as a slab in
           dark mode. Multiply drops white onto a lighter backdrop; inverting
           first turns the plate black so screen can drop it on a dark one. */
        mix-blend-mode: multiply;
      }

      @media (prefers-color-scheme: dark) {
        .partslinkWordmark img {
          filter: invert(1) hue-rotate(180deg);
          mix-blend-mode: screen;
        }
      }

      .partslinkWordmarkDivider {
        flex: 0 0 auto;
        width: 1px;
        height: 26px;
        background: var(--ag-color-rule-2);
      }

      .partslinkWordmark span:not(.partslinkWordmarkDivider) {
        color: var(--ag-color-accent-dark);
        font-size: 18px;
        font-weight: 800;
        line-height: 1;
        white-space: nowrap;
      }

      .partslinkHeaderActions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--ag-space-md);
        min-width: 0;
      }

      .partslinkUiLanguageSwitch {
        display: inline-flex;
        flex: 0 0 auto;
        overflow: hidden;
        border: 1px solid var(--ag-color-rule-2);
        border-radius: var(--ag-radius-control);
      }

      .partslinkUiLanguageSwitch button {
        min-width: 42px;
        border: 0;
        background: var(--ag-color-surface);
        color: var(--ag-color-muted);
        padding: 7px 12px;
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
      }

      .partslinkUiLanguageSwitch button + button {
        border-left: 1px solid var(--ag-color-rule-2);
      }

      .partslinkUiLanguageSwitch button[aria-pressed="true"] {
        background: var(--ag-color-accent-dark);
        color: var(--ag-color-accent-ink);
      }

      .partslinkPanelTitle {
        margin: 0;
        color: var(--ag-color-muted);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.05em;
        line-height: 1.2;
        text-transform: uppercase;
      }

      .partslinkWorkbench {
        display: grid;
        grid-template-columns: minmax(0, 400px) minmax(0, 1fr);
        gap: var(--ag-space-lg);
        align-items: stretch;
        /* The hero section used to hold this gap below the header rule. */
        margin-top: var(--ag-space-xl);
      }

      .partslinkCard,
      .partslinkResultCard {
        border: var(--ag-rule-card);
        border-radius: var(--ag-radius-card);
        background: var(--ag-color-surface);
        padding: var(--ag-space-xl);
      }

      .partslinkCard {
        display: grid;
        grid-template-rows: auto auto auto auto minmax(0, 1fr) auto;
        gap: var(--ag-space-sm);
      }

      .partslinkField {
        display: grid;
        gap: var(--ag-space-label-gap);
        color: var(--ag-color-ink-2);
        font-size: var(--ag-text-sm);
        font-weight: 600;
        line-height: 1.3;
      }

      .partslinkField span {
        display: block;
      }

      .partslinkField input,
      .partslinkField select {
        width: 100%;
        min-height: var(--ag-size-action);
        border: var(--ag-rule-field);
        border-radius: var(--ag-radius-input);
        background: var(--ag-color-surface);
        color: var(--ag-color-ink);
        padding: var(--ag-space-control-y) var(--ag-space-field-x);
        font: inherit;
        font-size: var(--ag-text-base);
        font-weight: 600;
        letter-spacing: 0;
        transition: background-color var(--ag-dur-short) var(--ag-ease-out), border-color var(--ag-dur-short) var(--ag-ease-out);
      }

      .partslinkField input:hover,
      .partslinkField select:hover {
        background: var(--ag-color-surface-tint);
      }

      .partslinkField select.partslinkBrandNativeSelect {
        position: absolute;
        top: 0;
        left: 0;
        width: 1px;
        min-height: 0;
        height: 1px;
        padding: 0;
        border: 0;
        opacity: 0;
        pointer-events: none;
      }

      .partslinkBrandPicker {
        position: relative;
      }

      .partslinkBrandPickerButton {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        min-height: var(--ag-size-action);
        border: var(--ag-rule-field);
        border-radius: var(--ag-radius-input);
        background: var(--ag-color-surface);
        color: var(--ag-color-ink);
        padding: var(--ag-space-control-y) var(--ag-space-field-x);
        font: inherit;
        font-size: var(--ag-text-base);
        font-weight: 400;
        text-align: left;
        cursor: pointer;
        transform: none;
        transition: background-color var(--ag-dur-short) var(--ag-ease-out), border-color var(--ag-dur-short) var(--ag-ease-out);
      }

      .partslinkBrandPickerButton:hover,
      .partslinkBrandPickerButton:focus-visible,
      .partslinkBrandPickerButton:active,
      .partslinkBrandPickerButton[aria-expanded="true"] {
        border-color: var(--ag-color-accent);
        background: var(--ag-color-surface-tint);
        transform: none;
        box-shadow: none;
      }

      .partslinkBrandPickerButton[data-favorite="true"] {
        font-weight: 700;
      }

      .partslinkBrandCaret {
        flex: 0 0 auto;
        margin-left: var(--ag-space-sm);
        color: var(--ag-color-muted);
        font-size: 12px;
      }

      .partslinkBrandOptions {
        position: absolute;
        z-index: 20;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        display: grid;
        max-height: 340px;
        overflow-y: auto;
        border: var(--ag-rule-field);
        border-radius: var(--ag-radius-input);
        background: var(--ag-color-surface);
        box-shadow: 0 12px 28px rgb(21 48 74 / 16%);
      }

      .partslinkBrandOptions[hidden] {
        display: none;
      }

      .partslinkBrandOption {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--ag-color-rule);
        background: transparent;
        color: var(--ag-color-ink);
        padding: 10px var(--ag-space-field-x);
        font: inherit;
        font-size: var(--ag-text-base);
        font-weight: 400;
        text-align: left;
        cursor: pointer;
      }

      .partslinkBrandOption:last-child {
        border-bottom: 0;
      }

      .partslinkBrandGroupLabel {
        position: sticky;
        top: 0;
        z-index: 1;
        border-bottom: 1px solid var(--ag-color-rule-2);
        background: var(--ag-color-surface-tint);
        padding: 7px var(--ag-space-field-x) 6px;
        color: var(--ag-color-muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        line-height: 1.2;
        text-transform: uppercase;
      }

      /* Every group after the first opens with a heavier rule, so the three
         blocks read apart even while scrolling past a sticky heading. */
      .partslinkBrandGroupLabel + .partslinkBrandOption,
      .partslinkBrandGroupLabel:not(:first-child) {
        border-top: 2px solid var(--ag-color-rule-2);
      }

      .partslinkBrandGroupLabel:first-child {
        border-top: 0;
      }

      .partslinkBrandOption[data-favorite="true"] {
        font-weight: 700;
      }

      .partslinkBrandOption:hover,
      .partslinkBrandOption:focus-visible {
        background: var(--ag-color-surface-tint);
        color: var(--ag-color-accent-dark);
      }

      .partslinkBrandOption[aria-selected="true"] {
        background: var(--ag-color-option-selected);
        color: var(--ag-color-accent-dark);
        box-shadow: inset 3px 0 0 var(--ag-color-accent);
        font-weight: 600;
      }

      .partslinkBrandOption:focus-visible {
        outline: 1px solid var(--ag-color-rule-2);
        outline-offset: -1px;
      }

      .partslinkField input:focus-visible,
      .partslinkField select:focus-visible {
        border-color: var(--ag-color-accent);
      }

      .partslinkHint {
        min-height: 1lh;
        color: var(--ag-color-muted);
        font-size: var(--ag-text-xs);
        font-weight: 400;
        line-height: 1.35;
      }

      .partslinkActions {
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        gap: var(--ag-space-xs);
        flex-wrap: wrap;
        padding-top: var(--ag-space-md);
        order: 2;
      }

      .partslinkShell button:not(.partslinkBrandOption):not(.partslinkBrandPickerButton),
      .partslinkDownloadLink {
        transition: background-color var(--ag-dur-short) var(--ag-ease-out), border-color var(--ag-dur-short) var(--ag-ease-out), color var(--ag-dur-short) var(--ag-ease-out), box-shadow var(--ag-dur-short) var(--ag-ease-out), transform 100ms var(--ag-ease-out);
      }

      .partslinkShell button:not(.partslinkBrandOption):not(.partslinkBrandPickerButton):hover:not(:disabled),
      .partslinkShell button:not(.partslinkBrandOption):not(.partslinkBrandPickerButton):focus-visible:not(:disabled),
      .partslinkDownloadLink:hover,
      .partslinkDownloadLink:focus-visible {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgb(12 72 111 / 14%);
      }

      .partslinkShell button:not(.partslinkBrandOption):not(.partslinkBrandPickerButton):active:not(:disabled),
      .partslinkDownloadLink:active {
        transform: translateY(1px);
        box-shadow: none;
      }

      .partslinkActions button:not(.partslinkIconButton),
      .partslinkDownloadLink {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: var(--ag-size-download-action);
        border: 1px solid var(--ag-color-accent);
        border-radius: var(--ag-radius-control);
        background: var(--ag-color-accent);
        color: var(--ag-color-accent-ink);
        padding: var(--ag-space-control-y) var(--ag-space-button-x);
        font: inherit;
        font-size: 13.5px;
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
        transition: background-color var(--ag-dur-short) var(--ag-ease-out), border-color var(--ag-dur-short) var(--ag-ease-out), transform 100ms var(--ag-ease-out);
      }

      .partslinkActions button:hover,
      .partslinkDownloadLink:hover {
        transform: translateY(-1px);
      }

      .partslinkActions button:active,
      .partslinkDownloadLink:active {
        transform: translateY(1px);
      }

      .partslinkActions button:disabled {
        border-color: var(--ag-color-rule-2);
        background: var(--ag-color-rule);
        color: var(--ag-color-muted);
        cursor: wait;
        transform: none;
      }

      .partslinkActions button.partslinkCheckAction {
        gap: var(--ag-space-xs);
        min-height: var(--ag-size-action);
        padding: 0 var(--ag-space-button-x);
      }

      .partslinkActions button.partslinkCancelAction {
        gap: var(--ag-space-xs);
        min-height: var(--ag-size-action);
        padding: 0 var(--ag-space-md);
        border-color: var(--ag-color-rule-2);
        background: var(--ag-color-surface);
        color: var(--ag-color-ink-2);
      }

      .partslinkActions button.partslinkCancelAction:hover,
      .partslinkActions button.partslinkCancelAction:focus-visible {
        border-color: var(--ag-color-accent);
        color: var(--ag-color-accent-dark);
      }

      .partslinkActions button.partslinkCancelAction[hidden] {
        display: none;
      }

      .partslinkProgress {
        order: -1;
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        margin-right: auto;
      }

      .partslinkProgress[hidden] {
        display: none;
      }

      .partslinkWheel {
        width: 34px;
        height: 34px;
        animation: partslinkWheelSpin 1.05s linear infinite;
      }

      .partslinkWheelTyre {
        fill: none;
        stroke: var(--ag-color-accent-dark);
        stroke-width: 4.5;
      }

      .partslinkWheelRim {
        fill: var(--ag-color-surface);
        stroke: var(--ag-color-accent);
        stroke-width: 2;
      }

      .partslinkWheelSpokes line {
        stroke: var(--ag-color-accent);
        stroke-width: 3;
        stroke-linecap: round;
      }

      .partslinkWheelHub {
        fill: var(--ag-color-accent);
      }

      @keyframes partslinkWheelSpin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        /* The global reduce block forces animation-duration and
           iteration-count with !important, so a slower spin is not reachable.
           Hold the wheel still instead: the elapsed-seconds counter already
           carries liveness without motion. */
        .partslinkWheel {
          animation: none;
        }

        .partslinkResultCard[data-loading="true"] .partslinkReadonlyField {
          background-image: none;
          background-color: var(--ag-color-rule);
        }
      }

      .partslinkDownloadLink[hidden] {
        display: none;
      }

      .partslinkDownloadLink.partslinkIconButton {
        width: 32px;
        min-width: 32px;
        height: 32px;
        min-height: 32px;
        flex: 0 0 auto;
        border-color: var(--ag-color-accent);
        background: var(--ag-color-accent);
        color: var(--ag-color-accent-ink);
        padding: 0;
      }

      .partslinkDownloadLink.partslinkIconButton:hover,
      .partslinkDownloadLink.partslinkIconButton:focus-visible {
        border-color: var(--ag-color-accent);
        background: var(--ag-color-accent);
        color: var(--ag-color-accent-ink);
      }

      .partslinkDownloadLinks {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .partslinkFileActions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        flex-wrap: wrap;
      }

      .partslinkHistoryDelete {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: var(--ag-size-download-action);
        border: 1px solid var(--ag-color-accent);
        border-radius: var(--ag-radius-control);
        background: var(--ag-color-accent);
        color: var(--ag-color-accent-ink);
        padding: var(--ag-space-control-y) var(--ag-space-button-x);
        font: inherit;
        font-size: 13.5px;
        font-weight: 700;
        white-space: nowrap;
        cursor: pointer;
      }

      .partslinkIconButton {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        min-width: 32px;
        height: 32px;
        min-height: 32px;
        padding: 0;
        box-sizing: border-box;
        border: 1px solid var(--ag-color-rule-2);
        border-radius: var(--ag-radius-control);
        background: var(--ag-color-surface);
        color: var(--ag-color-accent-dark);
        font-family: var(--ag-font-body);
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
      }

      .partslinkIconButton:hover:not(:disabled),
      .partslinkIconButton:focus-visible {
        border-color: var(--ag-color-accent);
        background: var(--ag-color-surface-tint);
        color: var(--ag-color-accent-dark);
        outline: 0;
      }

      .partslinkIconButton:disabled {
        border-color: var(--ag-color-rule-2);
        background: var(--ag-color-surface-tint);
        color: var(--ag-color-muted);
        cursor: not-allowed;
      }

      .partslinkActions .partslinkIconButton {
        padding: 0;
        border-color: var(--ag-color-rule-2);
        background: var(--ag-color-surface);
        color: var(--ag-color-accent-dark);
        font-family: var(--ag-font-body);
        font-size: 12px;
        font-weight: 700;
      }

      .partslinkActions .partslinkIconButton:disabled {
        border-color: var(--ag-color-rule-2);
        background: var(--ag-color-surface-tint);
        color: var(--ag-color-muted);
      }

      .partslinkActionIcon {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .partslinkSearchIcon {
        width: 14px;
        height: 14px;
        stroke-width: 1.8;
      }

      .partslinkSaveIcon {
        width: 16px;
        height: 16px;
      }

      .partslinkHistory {
        display: grid;
        gap: var(--ag-space-md);
        margin-top: var(--ag-space-lg);
        border: var(--ag-rule-card);
        border-radius: var(--ag-radius-card);
        background: var(--ag-color-surface);
        padding: var(--ag-space-xl);
      }

      .partslinkHistoryList {
        display: grid;
        gap: var(--ag-space-sm);
        max-block-size: min(42vh, 420px);
        overflow: auto;
      }

      .partslinkHistoryHeader,
      .partslinkHistoryRow {
        display: grid;
        grid-template-columns: repeat(6, minmax(140px, 1fr)) 42px 42px;
        gap: 18px;
        align-items: center;
        min-width: 1120px;
        text-align: center;
      }

      .partslinkHistoryHeader {
        padding: 0 var(--ag-space-sm);
        color: var(--ag-color-muted);
        font-size: var(--ag-text-xs);
        font-weight: 700;
        line-height: 1.3;
      }

      .partslinkHistoryRow {
        border: var(--ag-rule-field);
        border-radius: var(--ag-radius-input);
        background: var(--ag-color-surface-tint);
        padding: var(--ag-space-sm);
      }

      .partslinkHistoryValue {
        color: var(--ag-color-ink);
        font-size: var(--ag-text-sm);
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .partslinkHistorySavedAt {
        display: grid;
        gap: 2px;
        color: var(--ag-color-muted);
        font-weight: 600;
        line-height: 1.25;
      }

      .partslinkHistorySavedTime {
        font-size: var(--ag-text-xs);
        font-weight: 500;
      }

      .partslinkHistoryDelete {
        min-width: 42px;
        padding-inline: 12px;
        background: transparent;
        color: var(--ag-color-error);
        border-color: var(--ag-color-rule-2);
        font-size: 18px;
      }

      .partslinkHistoryFavorite {
        min-width: 42px;
        padding-inline: 8px;
        border-color: var(--ag-color-rule-2);
        background: transparent;
        color: #8a6d00;
        font-size: 18px;
      }

      .partslinkHistoryFavorite.isPinned {
        background: #fff8db;
      }

      .partslinkResultCard {
        display: grid;
        align-content: start;
        gap: var(--ag-space-md);
      }

      .partslinkResultHead {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: var(--ag-space-sm);
      }

      .partslinkCopyResult {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        border: 1px solid var(--ag-color-rule-2);
        border-radius: var(--ag-radius-control);
        background: var(--ag-color-surface);
        color: var(--ag-color-accent-dark);
        padding: 0;
        font-family: var(--ag-font-body);
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
      }

      .partslinkCopyResultIcon {
        font-size: 17px;
        font-weight: 400;
      }

      .partslinkCopyResult:hover:not(:disabled),
      .partslinkCopyResult:focus-visible {
        border-color: var(--ag-color-accent);
        background: var(--ag-color-surface-tint);
      }

      .partslinkCopyResult:disabled {
        color: var(--ag-color-muted);
        background: var(--ag-color-surface-tint);
        cursor: not-allowed;
        opacity: 1;
      }

      .partslinkSpecRows {
        display: grid;
        gap: 0;
      }

      .partslinkSpecRow {
        display: grid;
        grid-template-columns: minmax(0, 0.68fr) minmax(var(--ag-result-min-width), 1fr);
        gap: var(--ag-space-md);
        align-items: center;
        min-height: calc(var(--ag-size-action) + var(--ag-space-sm));
        border-bottom: 2px solid var(--ag-color-rule);
        padding: var(--ag-space-sm) 0;
      }

      .partslinkSpecRow:first-child {
        border-bottom-color: var(--ag-color-soft);
      }

      .partslinkSpecRow:last-child {
        border-bottom: 0;
      }

      .partslinkSpecRow span {
        color: var(--ag-color-ink);
        font-size: var(--ag-text-base);
        font-weight: 600;
      }

      .partslinkSpecRow strong,
      .partslinkReadonlyField {
        color: var(--ag-color-accent-dark);
        font-size: var(--ag-text-md);
        font-weight: 800;
        line-height: 1.2;
      }

      .partslinkReadonlyField {
        width: 100%;
        min-height: var(--ag-size-action);
        border: var(--ag-rule-field);
        border-radius: var(--ag-radius-input);
        background: var(--ag-color-surface-tint);
        padding: var(--ag-space-control-y) var(--ag-space-field-x);
        font-family: var(--ag-font-body);
      }

      .partslinkReadonlyField::placeholder {
        color: var(--ag-color-muted);
      }

      .partslinkResultCard[data-loading="true"] .partslinkReadonlyField {
        color: transparent;
        background-image: linear-gradient(
          90deg,
          var(--ag-color-surface-tint) 0%,
          var(--ag-color-rule) 50%,
          var(--ag-color-surface-tint) 100%
        );
        background-size: 200% 100%;
        animation: partslinkSkeleton 1.4s ease-in-out infinite;
      }

      .partslinkResultCard[data-loading="true"] .partslinkReadonlyField::placeholder {
        color: transparent;
      }

      @keyframes partslinkSkeleton {
        to { background-position: -200% 0; }
      }

      .partslinkFileBlock {
        display: grid;
        gap: var(--ag-space-md);
        margin-top: var(--ag-space-lg);
        border: var(--ag-rule-card);
        border-radius: var(--ag-radius-card);
        background: var(--ag-color-surface);
        padding: var(--ag-space-xl);
      }

      .partslinkFileHead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--ag-space-md);
        flex-wrap: wrap;
      }

      .partslinkFileViewer {
        display: grid;
        gap: var(--ag-space-md);
        border: var(--ag-rule-field);
        border-radius: var(--ag-radius-input);
        background: var(--ag-color-surface-tint);
        overflow: hidden;
      }

      .partslinkFileViewer[data-empty="true"] {
        place-items: center;
        min-height: 220px;
      }

      .partslinkFileEmpty {
        margin: 0;
        padding: var(--ag-space-lg);
        color: var(--ag-color-muted);
        font-size: var(--ag-text-sm);
        line-height: 1.4;
        text-align: center;
      }

      .partslinkFilePane {
        display: grid;
        gap: 0;
        min-width: 0;
      }

      .partslinkFileCaption {
        margin: 0;
        border-bottom: var(--ag-rule-field);
        background: var(--ag-color-surface);
        padding: var(--ag-space-sm) var(--ag-space-field-x);
        color: var(--ag-color-ink-2);
        font-size: var(--ag-text-xs);
        font-weight: 700;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }

      .partslinkFileFrame {
        display: block;
        width: 100%;
        height: min(78vh, 900px);
        min-height: 520px;
        border: 0;
        background: var(--ag-color-surface);
      }

      .partslinkFileText {
        display: block;
        box-sizing: border-box;
        width: 100%;
        height: min(78vh, 900px);
        min-height: 520px;
        border: 0;
        background: var(--ag-color-surface);
        color: var(--ag-color-ink);
        padding: var(--ag-space-field-x);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        line-height: 1.45;
        resize: vertical;
        white-space: pre;
      }

      .partslinkStatus {
        align-self: start;
        order: 1;
        min-height: 20px;
        margin: 0;
        color: var(--ag-color-ink-2);
        font-size: var(--ag-text-sm);
        line-height: 1.4;
      }

      .partslinkStatus[data-tone="success"] {
        color: var(--ag-color-success);
        font-weight: 700;
      }

      .partslinkStatus[data-tone="error"] {
        color: var(--ag-color-error);
        font-weight: 700;
      }

      @media (max-width: 780px) {
        .partslinkShell {
          width: min(100% - 32px, 1200px);
          padding-top: var(--ag-space-xl);
        }

        .partslinkTopbar,
        .partslinkWorkbench {
          grid-template-columns: 1fr;
        }

        .partslinkTopbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .partslinkHeaderActions {
          justify-content: flex-end;
          width: 100%;
        }

        .partslinkCard,
        .partslinkResultCard,
        .partslinkFileBlock {
          padding: var(--ag-space-lg);
        }

        .partslinkFileFrame {
          height: min(70vh, 720px);
          min-height: 420px;
        }

        .partslinkFileText {
          height: min(70vh, 720px);
          min-height: 420px;
        }
      }

      @media (max-width: 420px) {
        .partslinkShell {
          width: min(100% - 24px, 1200px);
        }

        .partslinkWordmark {
          align-items: flex-start;
          flex-direction: column;
          gap: var(--ag-space-2xs);
        }

        .partslinkWordmarkDivider {
          display: none;
        }

        .partslinkActions {
          align-items: flex-end;
          flex-direction: column;
        }

        .partslinkActions button:not(.partslinkIconButton),
        .partslinkDownloadLink {
          width: 100%;
          min-height: var(--ag-size-action);
        }

        .partslinkSpecRow {
          grid-template-columns: 1fr;
          gap: var(--ag-space-xs);
        }

        /* The 1fr row exists to match the result card's height side by side.
           Stacked, it is just a hole under the VIN field. */
        .partslinkCard {
          grid-template-rows: none;
        }

        .partslinkProgress {
          align-self: flex-start;
          margin-right: 0;
        }

        .partslinkHistoryHeader {
          display: none;
        }

        .partslinkHistoryList {
          overflow-x: visible;
        }

        .partslinkHistoryRow {
          grid-template-columns: minmax(0, 1fr) auto;
          gap: var(--ag-space-sm) var(--ag-space-sm);
          min-width: 0;
          text-align: left;
        }

        .partslinkHistoryRow .partslinkHistoryValue {
          display: grid;
          gap: 2px;
          grid-column: 1;
        }

        .partslinkHistoryRow .partslinkHistoryValue::before {
          content: attr(data-label);
          color: var(--ag-color-muted);
          font-size: var(--ag-text-xs);
          font-weight: 700;
          line-height: 1.2;
        }

        .partslinkHistoryDelete {
          grid-column: 2;
          grid-row: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 150ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 150ms !important;
        }
      }
    </style>
  </head>
  <body class="partslinkPage">
    <main class="partslinkShell">
      <header class="partslinkTopbar">
        <a class="partslinkWordmark" href="./" aria-label="AUTOGOOD Tools">
          <img src="./assets/autogood-logo.png" alt="AUTOGOOD" />

            <button type="button" data-ui-language="ru" aria-pressed="true">RU</button>
          </div>
        </div>
      </header>

      <!-- The page keeps one h1 so the heading outline stays valid and the
           document has a name; it is not painted above the form any more. -->
      <h1 class="srOnly" data-ui-key="vinCheck">Проверка VIN</h1>

      <section class="partslinkWorkbench" aria-label="VIN PDF and production date form">
        <div class="partslinkCard">

            <div class="partslinkBrandPicker partslinkLanguagePicker">

                <span id="partslinkLanguageLabel"></span>
                <span class="partslinkBrandCaret" aria-hidden="true">&#9662;</span>

      function readApiBaseFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const value = params.get("api") || params.get("backend");
        if (!value) return "";

        let url;
        try {
          url = new URL(value.trim());
        } catch {
          console.warn("PartsLink24: ?api= is not a valid URL, ignoring it.");
          return "";
        }

        const isLocal = /^(?:localhost|127\.0\.0\.1)$/i.test(url.hostname);
        if (url.protocol !== "https:" && !(isLocal && url.protocol === "http:")) {
          console.warn("PartsLink24: ?api= must use https, ignoring it.");
          return "";
        }
        if (!allowedApiHostPatterns.some((pattern) => pattern.test(url.hostname))) {
          console.warn(`PartsLink24: ?api= host ${url.hostname} is not allowed, ignoring it.`);
          return "";
        }

        return `${url.protocol}//${url.host}`;
      }

      function getPartslinkApiBase() {
        const urlApiBase = readApiBaseFromUrl();
        if (urlApiBase) return urlApiBase;
        if (window.PARTSLINK24_API_BASE) {
          return String(window.PARTSLINK24_API_BASE).replace(/\/$/, "");
        }
        if (["127.0.0.1", "localhost"].includes(window.location.hostname)) {
          return "";
        }
        return defaultPartslinkApiBase;
      }

      function formatVinCheckError(error) {
        const source = String(error?.message || error || "").toLowerCase();
        const reasons = uiText("vinCheckReasons");
        let reason = reasons.generic;

        if (/unsupported.*brand|поддерживаемую\s+марку|марка.*поддерж/i.test(source)) reason = reasons.unsupportedBrand;
        else if (/логотип.*марки|brand.*(?:logo|not found)|марка.*(?:не найдена|not found)/i.test(source)) reason = reasons.brandNotFound;
        else if (/login|logowanie|вход|username|password|парол/i.test(source)) reason = reasons.login;
        else if (/не вернул.*pdf|nie zwrócił.*pdf|did not.*pdf|pdf.*(?:not|не).*(?:returned|получен)/i.test(source)) reason = reasons.pdf;
        else if (/не вернул.*(?:результат|данн)|nie zwrócił.*(?:wynik|dan)|did not.*(?:result|data)|сервер не вернул файл/i.test(source)) reason = reasons.data;
        else if (/blocked|forbidden|access denied|доступ.*огранич|заблокир/i.test(source)) reason = reasons.blocked;
        else if (/failed to fetch|network|backend|сервер|connection|соединени|unknown system error|econn/i.test(source)) reason = reasons.unavailable;

        return uiText("vinCheckFailed", reason);
      }

      function trimVinHistory(entries) {
        const sorted = [...entries].sort((left, right) => {
          if (Boolean(left.pinned) !== Boolean(right.pinned)) return left.pinned ? -1 : 1;
          return new Date(right.savedAt || 0) - new Date(left.savedAt || 0);
        });
        const pinned = sorted.filter((entry) => entry.pinned);
        return [...pinned, ...sorted.filter((entry) => !entry.pinned).slice(0, vinHistoryLimit)];
      }

        const helper = document.createElement("textarea");
        helper.value = value;

        helper.style.position = "fixed";
        helper.style.opacity = "0";
        document.body.append(helper);
        helper.select();
        const copied = document.execCommand("copy");
        helper.remove();
        if (!copied) throw new Error(uiText("copyError"));

          const fileName = makePdfFileName(brand, vin);
          const separator = file.downloadUrl.includes("?") ? "&" : "?";
          const directUrl = `${apiBase}${file.downloadUrl}${separator}downloadName=${encodeURIComponent(fileName)}`;

          const link = document.createElement("a");
          const downloadLabel = usableFiles.length > 1 ? uiText("downloadFileNumber", index + 1) : uiText("downloadFile");
          link.className = "partslinkDownloadLink partslinkIconButton";
          // Always download from the server URL. The server enforces the final
          // filename, while the blob URL is used only for the embedded preview.
          link.href = directUrl;
          link.download = fileName;
          link.setAttribute("aria-label", downloadLabel);
          link.title = downloadLabel;
          link.innerHTML = `
            <svg class="partslinkActionIcon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 3v12"></path>
              <path d="m7 10 5 5 5-5"></path>
              <path d="M5 21h14"></path>
            </svg>
          `;
          downloadLinks.append(link);

          const pane = document.createElement("div");
          pane.className = "partslinkFilePane";
          if (usableFiles.length > 1) {
            const caption = document.createElement("p");
            caption.className = "partslinkFileCaption";
            caption.textContent = fileName;
            pane.append(caption);
          }
          const previewSeparator = directUrl.includes("?") ? "&" : "?";
          const previewUrl = `${directUrl}${previewSeparator}preview=1`;
          if (previewUrl) {
            const frame = document.createElement("iframe");
            frame.className = "partslinkFileFrame";
            frame.src = previewUrl;
            frame.title = fileName;
            pane.append(frame);
          }
          fileViewer.append(pane);
        }

        downloadLinks.hidden = downloadLinks.children.length === 0;
      }

      function renderBrands() {
        brandSelect.innerHTML = "";
        brandPickerOptions.replaceChildren();
        const orderedBrands = brandDisplayOrder.filter((brand) => brandRoutes[brand]);
        const unlistedBrands = Object.keys(brandRoutes)
          .filter((brand) => !brandDisplayOrder.includes(brand))
          .sort((left, right) => left.localeCompare(right, "ru"));
        const options = [...orderedBrands, ...unlistedBrands].map((brand) => ({
          value: brand,
          label: brandLabels[brand] || brand,
          favorite: favoriteBrandValues.has(brand)
        }));

        let renderedGroup = "";
        options.forEach((brand) => {
          const groupLabel = brandGroupLabels.get(brand.value) || "";
          if (groupLabel && groupLabel !== renderedGroup) {
            renderedGroup = groupLabel;
            // Headings carry no option role, so arrow keys, typeahead and the
            // selected-option lookup keep seeing only real brands.
            const heading = document.createElement("div");
            heading.className = "partslinkBrandGroupLabel";
            heading.role = "presentation";
            heading.textContent = groupLabel;
            brandPickerOptions.append(heading);
          }

          const option = document.createElement("option");
          option.value = brand.value;
          option.textContent = brand.label;
          if (brand.favorite) option.dataset.favorite = "true";
          brandSelect.append(option);

          const pickerOption = document.createElement("button");
          pickerOption.type = "button";
          pickerOption.className = "partslinkBrandOption";
          pickerOption.role = "option";
          // Roving focus: options are reachable with the arrow keys from the
          // combobox, never as 54 separate tab stops.
          pickerOption.tabIndex = -1;
          pickerOption.id = `partslinkBrandOption-${brand.value.replace(/[^A-Za-z0-9]+/g, "-")}`;
          pickerOption.dataset.value = brand.value;
          pickerOption.dataset.favorite = String(brand.favorite);
          pickerOption.dataset.search = [brand.label, brand.value]
            .map(normalizeBrandSearch)
            .filter((value, index, values) => value && values.indexOf(value) === index)
            .join("\n");
          pickerOption.textContent = brand.label;
          pickerOption.addEventListener("click", () => {
            brandSelect.value = brand.value;
            brandSelect.dispatchEvent(new Event("change"));
            closeBrandPicker();
          });
          brandPickerOptions.append(pickerOption);
        });
        applyBrandLogic();
      }

      function renderLanguages() {
        languagePickerOptions.replaceChildren();
        [...languageSelect.options].forEach((language) => {
          const pickerOption = document.createElement("button");
          pickerOption.type = "button";
          pickerOption.className = "partslinkBrandOption";
          pickerOption.role = "option";
          pickerOption.tabIndex = -1;
          pickerOption.id = `partslinkLanguageOption-${language.value}`;
          pickerOption.dataset.value = language.value;
          pickerOption.dataset.favorite = "true";
          pickerOption.textContent = language.textContent;
          pickerOption.addEventListener("click", () => {
            languageSelect.value = language.value;
            languageSelect.dispatchEvent(new Event("change"));
            closeLanguagePicker();
          });
          languagePickerOptions.append(pickerOption);
        });
        applyLanguageLogic();
      }

      function applyLanguageLogic() {
        languagePickerLabel.textContent = languageSelect.selectedOptions[0]?.textContent || "";
        languagePickerButton.dataset.favorite = "true";
        languagePickerOptions.querySelectorAll("[role='option']").forEach((option) => {
          option.setAttribute("aria-selected", String(option.dataset.value === languageSelect.value));
        });
      }

      function applyBrandLogic() {
        const selectedLabel = brandSelect.selectedOptions[0]?.textContent || "";
        const isFavorite = favoriteBrandValues.has(brandSelect.value);
        brandPickerLabel.textContent = selectedLabel;
        brandPickerButton.dataset.favorite = String(isFavorite);
        brandPickerOptions.querySelectorAll("[role='option']").forEach((option) => {
          option.setAttribute("aria-selected", String(option.dataset.value === brandSelect.value));
        });
        const current = brandRoutes[brandSelect.value];
        if (!current) return;
        vinInput.placeholder = current.sampleVin || "";
        vinInput.dataset.route = current.route || "";
      }

      function closeBrandPicker() {
        brandPickerOptions.hidden = true;
        brandPickerButton.setAttribute("aria-expanded", "false");
        clearTimeout(brandTypeaheadTimer);
        brandTypeahead = "";
      }

      function toggleBrandPicker() {
        const isOpen = !brandPickerOptions.hidden;
        brandPickerOptions.hidden = isOpen;
        brandPickerButton.setAttribute("aria-expanded", String(!isOpen));
        if (!isOpen) {
          brandPickerOptions.querySelector('[aria-selected="true"]')?.focus();
        }
      }

      function selectBrandOption(option, { focus = true } = {}) {
        if (!option) return;
        brandSelect.value = option.dataset.value;
        brandSelect.dispatchEvent(new Event("change"));
        if (brandPickerOptions.hidden) toggleBrandPicker();
        if (focus) {
          option.focus();
          option.scrollIntoView({ block: "nearest" });
        }
      }

      function normalizeBrandSearch(value) {
        return String(value || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .trim()
          .toLocaleLowerCase();
      }

      function brandOptionMatches(option, query) {
        return String(option.dataset.search || "")
          .split("\n")
          .some((value) => value.startsWith(query));
      }

      function selectBrandFromTypeahead(event) {
        if (event.ctrlKey || event.metaKey || event.altKey || !/^[a-z]$/i.test(event.key)) return;

        clearTimeout(brandTypeaheadTimer);
        const typed = normalizeBrandSearch(event.key);
        const options = [...brandPickerOptions.querySelectorAll("[role='option']")];
        const currentIndex = options.findIndex((option) => option.dataset.value === brandSelect.value);
        brandTypeahead += typed;
        let matches = options.filter((option) => brandOptionMatches(option, brandTypeahead));

        if (!matches.length) {
          brandTypeahead = typed;
          matches = options.filter((option) => brandOptionMatches(option, typed));
          if (matches.length > 1) {
            const next = options.slice(currentIndex + 1).find((option) => matches.includes(option));
            if (next) matches = [next];
          }
        }

        event.preventDefault();
        brandTypeaheadTimer = setTimeout(() => {
          brandTypeahead = "";
        }, brandTypeaheadTimeout);

        const match = matches[0];
        if (!match) return;

        selectBrandOption(match);
      }

      function navigateBrandPicker(event) {
        const options = [...brandPickerOptions.querySelectorAll("[role='option']")];
        if (!options.length) return;
        const activeOption = document.activeElement.closest?.("[role='option']");
        const selectedIndex = options.findIndex((option) => option.dataset.value === brandSelect.value);
        const currentIndex = activeOption ? options.indexOf(activeOption) : selectedIndex;

        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          if (brandPickerOptions.hidden) toggleBrandPicker();
          const direction = event.key === "ArrowDown" ? 1 : -1;
          const nextIndex = (Math.max(currentIndex, 0) + direction + options.length) % options.length;
          options[nextIndex].focus();
          options[nextIndex].scrollIntoView({ block: "nearest" });
          return;
        }

        if (event.key === "Enter" && activeOption) {
          event.preventDefault();
          selectBrandOption(activeOption, { focus: false });
          closeBrandPicker();
          brandPickerButton.focus();
          return;
        }

        if (event.key === "Escape") {
          event.preventDefault();
          closeBrandPicker();
          brandPickerButton.focus();
          return;
        }

        selectBrandFromTypeahead(event);
      }

      function closeLanguagePicker() {
        languagePickerOptions.hidden = true;
        languagePickerButton.setAttribute("aria-expanded", "false");
      }

      function toggleLanguagePicker() {
        const isOpen = !languagePickerOptions.hidden;
        languagePickerOptions.hidden = isOpen;
        languagePickerButton.setAttribute("aria-expanded", String(!isOpen));
        if (!isOpen) {
          languagePickerOptions.querySelector('[aria-selected="true"]')?.focus();
        }
      }

      vinInput.addEventListener("input", () => {
        vinInput.value = vinInput.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 17);
        resetResults();
      });
      vinInput.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        runVinCheck();
      });
      brandSelect.addEventListener("change", () => {
        vinInput.value = "";
        resetResults();
        applyBrandLogic();
      });
      brandPickerButton.addEventListener("click", toggleBrandPicker);
      brandPicker.addEventListener("keydown", (event) => {
        navigateBrandPicker(event);
      });
      languagePickerButton.addEventListener("click", toggleLanguagePicker);
      languagePickerButton.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          if (languagePickerOptions.hidden) toggleLanguagePicker();
        }
      });
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".partslinkBrandPicker")) closeBrandPicker();
        if (!event.target.closest(".partslinkLanguagePicker")) closeLanguagePicker();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeBrandPicker();
          closeLanguagePicker();
        }
      });
      languageSelect.addEventListener("change", () => {
        resetResults();
        applyLanguageLogic();
      });
      uiLanguageButtons.forEach((button) => {
        button.addEventListener("click", () => applyUiLanguage(button.dataset.uiLanguage));
      });

      applyUiLanguage(readStoredUiLanguage(), { persist: false });
      renderLanguages();
      resetDownloadLink();

      fetch("./tools/partslink24/brand-routes.json?v=20260901-1")
        .then((response) => response.ok ? response.json() : Promise.reject())
        .then((data) => {
          brandRoutes = data.brands || fallbackBrands;
          renderBrands();
        })
        .catch(renderBrands);

      function readPayload() {
        const vin = vinInput.value.trim().toUpperCase();
        const brand = brandSelect.value;
        const language = languageSelect.value;

        if (vin.length !== 17) {
          setStatusFromKey("invalidVin", "error");
          vinInput.focus();
          return null;
        }

        const forbidden = [...new Set(vin.match(forbiddenVinCharacters) || [])];
        if (forbidden.length) {
          setStatusFromKey("invalidVinChars", "error", forbidden.join(", "));
          vinInput.focus();
          return null;
        }

        return { brand, vin, language };
      }

      async function runVinCheck() {
        if (activeCheckController) return;

        const payload = readPayload();
        if (!payload) return;

        const controller = new AbortController();
        activeCheckController = controller;
        checkAbortReason = "";
        const timeoutId = window.setTimeout(() => {
          checkAbortReason = "timeout";
          controller.abort();
        }, checkTimeoutMs);

        setBusy(true);
        resetResults();
        startCheckProgress();
        try {
          const apiBase = getPartslinkApiBase();
          const response = await fetch(`${apiBase}/api/partslink24/check-vin`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(payload),
            signal: controller.signal
          });
          const result = await response.json().catch(() => ({}));
          stopCheckProgress();

          if (!response.ok || !result.ok) {
            throw new Error(result.error || uiText("backendUnavailable"));
          }

          const files = Array.isArray(result.files) && result.files.length
            ? result.files
            : [{ fileName: result.fileName, downloadUrl: result.downloadUrl }];
          setVehicleDescription(result.vehicleDescription || "");
          productionDateInput.dataset.rawValue = result.productionDate || "";
          engineTypeInput.dataset.rawValue = result.engineType || "";
          engineVolumeInput.dataset.rawValue = result.engineVolume || "";
          renderLocalizedResultValues();
          copyResultButton.disabled = !payload.vin || !productionDateInput.value;
          saveButton.disabled = !payload.vin || !vehicleDescriptionInput.value;
          saveCurrentVin();
          await renderDownloadLinks(files, apiBase, payload.brand, payload.vin);
          setStatusFromKey(files.length > 1 ? "readyMany" : "readyOne", "success");
        } catch (error) {
          if (error?.name === "AbortError") {
            setStatusFromKey(checkAbortReason === "timeout" ? "checkTimeout" : "checkCancelled", "error");
          } else {
            setStatus(formatVinCheckError(error), "error");
          }
        } finally {
          window.clearTimeout(timeoutId);
          stopCheckProgress();
          activeCheckController = null;
          checkAbortReason = "";
          setBusy(false);
        }
      }

      checkButton.addEventListener("click", runVinCheck);

      cancelButton.addEventListener("click", () => {
        if (!activeCheckController) return;
        checkAbortReason = "cancel";
        activeCheckController.abort();
      });

    </script>
  </body>
</html>
