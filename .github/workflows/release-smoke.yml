name: Production release smoke test

on:
  workflow_dispatch:
    inputs:
      pages_url:
        description: Public GitHub Pages base URL
        required: false
        default: https://belovn1999-rgb.github.io/ag-it-project/
      converter_url:
        description: Public DOCX-to-PDF converter endpoint
        required: false
        default: https://autogood-pdf-converter.onrender.com/api/convert-docx-to-pdf

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/release-smoke.mjs
        env:
          PAGES_URL: ${{ inputs.pages_url }}
          CONVERTER_URL: ${{ inputs.converter_url }}
